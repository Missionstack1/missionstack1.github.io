<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Snapshot Archive — MissionStack Academy</title>
<meta name="description" content="Weekly Tech Snapshot from MissionStack Academy: advancements, shortfalls, geopolitical impacts, crypto, and breaking tech news. Every Monday.">
<meta name="theme-color" content="#0b0f14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0f14'/%3E%3Cpath d='M14 46V18l18 16 18-16v28' fill='none' stroke='%2314b8a6' stroke-width='6' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="alternate" type="application/json" href="manifest.json" title="Tech Snapshot manifest">
<style>
:root{--bg:#0b0f14;--panel:#111821;--line:#1f2a36;--text:#e8f0f8;--muted:#94a3b8;--teal:#14b8a6;--amber:#f59e0b;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55}
a{color:var(--teal);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);background:rgba(11,15,20,.85);position:sticky;top:0;backdrop-filter:blur(10px)}
nav{height:64px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;letter-spacing:.14em;font-size:.8rem;color:var(--text)}
.mono{font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;font-size:.72rem;color:var(--muted)}
h1{font-size:clamp(1.8rem,4vw,2.8rem);margin:.4rem 0 .6rem;letter-spacing:-.01em}h1 span{color:var(--teal)}
.sub{color:var(--muted);max-width:620px}
.hero{padding:64px 0 32px}
.issue{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin:14px 0;color:var(--text);transition:border-color .2s}
.issue:hover{border-color:var(--teal);text-decoration:none}
.issue .d{color:var(--amber)}.issue h2{margin:.3rem 0 .4rem;font-size:1.25rem}.issue p{margin:0;color:var(--muted);font-size:.95rem}
.topics{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}.topics span{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;border:1px solid var(--line);padding:3px 8px;border-radius:4px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:32px;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);margin-top:64px;padding:28px 0;color:var(--muted);font-size:.85rem}footer a{color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap"><nav><a class="brand" href="../">MISSIONSTACK ACADEMY</a><a class="mono" href="https://missionstack.madethis.app">Open the app →</a></nav></div></header>
<main class="wrap">
  <div class="hero">
    <div class="mono">Weekly intel · Mondays 0540 Central</div>
    <h1>Tech <span>Snapshot</span></h1>
    <p class="sub">Advancements, shortfalls, geopolitical impacts, crypto, and breaking tech — Nintendo to Northrop Grumman, Nvidia to Palantir. Free for every learner.</p>
  </div>
  <div id="list"><div class="empty">Loading issues…</div></div>
</main>
<footer><div class="wrap">© <span id="yr"></span> MissionStack Academy · <a href="../">Home</a> · <a href="manifest.json">JSON feed</a></div></footer>
<script>
fetch('manifest.json',{cache:'no-store'}).then(r=>r.json()).then(m=>{
  const list=(m.issues||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('list').innerHTML=list.length?list.map(x=>`<a class="issue" href="${x.file}"><div class="mono d">${x.date} · Issue ${String(x.issue).padStart(3,'0')}</div><h2>${x.title}</h2><p>${x.summary||''}</p><div class="topics">${(x.topics||[]).map(t=>`<span>${t}</span>`).join('')}</div></a>`).join('')
  :'<div class="empty">No issues published yet. The first Tech Snapshot drops Monday morning.</div>';
}).catch(()=>{document.getElementById('list').innerHTML='<div class="empty">Could not load the archive manifest.</div>';});
document.getElementById('yr').textContent=new Date().getFullYear();
</script>
</body>
</html>
